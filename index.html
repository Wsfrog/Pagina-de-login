<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinição de Senha - Empresa Corp</title>
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f4f8; /* Cor de fundo cinza/azulado claro */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        /* Ícone/Logo azul no topo */
        .logo-icon {
            width: 54px;
            height: 54px;
            background: linear-gradient(180deg, #1882ff 0%, #0060d5 100%);
            border-radius: 12px;
            margin: 0 auto 20px;
        }

        .header-text {
            font-size: 13px;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .title {
            font-size: 18px;
            color: #1a1f36;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13px;
            color: #697386;
            line-height: 1.5;
            margin-bottom: 24px;
            padding: 0 10px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e6eb;
            border-radius: 4px;
            font-size: 14px;
            color: #333;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input::placeholder {
            color: #8f9bb3;
        }

        .form-group input:focus {
            border-color: #0056b3;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #005bb5;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #004a94;
        }

        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-icon"></div>
        
        <div class="header-text">Empresa Corp &middot; Portal de TI</div>
        
        <h1 class="title">Redefinição de Senha Corporativa</h1>
        <p class="subtitle">Sua senha expirou. Confirme sua identidade para<br>continuar.</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <input type="text" placeholder="Usuário (login corporativo)" required>
            </div>
            <div class="form-group">
                <input type="password" placeholder="Senha atual" required>
            </div>
            <div class="form-group">
                <input type="password" placeholder="Nova senha" required>
            </div>
            
            <button type="submit" class="submit-btn">Redefinir Senha Agora</button>
        </form>
        
        <div class="footer">
            &copy; 2026 Empresa Corp. Todos os direitos reservados.
        </div>
    </div>

</body>
</html>
